<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f9;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback {
            padding: 20px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Check PDF filename -->
    <iframe src="pr-pol.pdf" title="Privacy Policy">
        <div class="fallback">
            <p>Your browser does not support PDF viewing</p>
            <a href="privacy-policy.pdf" target="_blank">Press here for open or download Privacy Policy</a>
        </div>
    </iframe>
</body>
</html>
